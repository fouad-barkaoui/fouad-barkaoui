name: telemetry-snake

# Rebuilds the contribution-graph snake every day and publishes it to the `output` branch,
# which the README reads from. Run it once by hand after the first push (Actions tab -> Run workflow).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#e4f222&color_dots=#161718,#2b2f10,#5c6316,#a1ab1c,#e4f222
            dist/snake-light.svg?color_snake=#0f1011&color_dots=#ebedf0,#d9e08a,#bfc93a,#8f9714,#5c6316

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
